<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Modifier Pro | Web Edition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="container">
        <header>
            <h1>XML Modifier <span>Pro</span></h1>
            <p>Modifica etiquetas XML de forma masiva y segura en la nube.</p>
        </header>

        <main>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="messages">
                {% for message in messages %}
                  <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
                <div class="form-group file-upload" id="drop-area">
                    <label for="file" class="file-label">
                        <div class="icon">📁</div>
                        <span id="file-name-display">Haz clic o arrastra tu archivo XML aquí</span>
                        <input type="file" name="file" id="file" required hidden>
                    </label>
                </div>

                <div class="grid-fields">
                    <div class="form-group">
                        <label for="etiqueta">Etiqueta a buscar</label>
                        <input type="text" name="etiqueta" id="etiqueta" placeholder="Ej: nombre, precio..." required>
                    </div>

                    <div class="form-group">
                        <label for="valor_actual">Valor actual</label>
                        <input type="text" name="valor_actual" id="valor_actual" placeholder="Valor que deseas cambiar" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="valor_nuevo">Nuevo valor</label>
                        <input type="text" name="valor_nuevo" id="valor_nuevo" placeholder="Valor por el que se reemplazará" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span>Procesar y Descargar</span>
                    <div class="loader" hidden></div>
                </button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Modificador XML Pro. Desarrollado con Antigravity.</p>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const dropArea = document.getElementById('drop-area');
        const form = document.getElementById('upload-form');
        const submitBtn = document.getElementById('submit-btn');

        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = fileInput.files[0].name;
                dropArea.classList.add('has-file');
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dropArea.addEventListener('dragover', () => dropArea.classList.add('dragover'));
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => {
            dropArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileNameDisplay.textContent = files[0].name;
                dropArea.classList.add('has-file');
            }
        });

        form.addEventListener('submit', () => {
            submitBtn.classList.add('loading');
            submitBtn.querySelector('span').textContent = 'Procesando...';
        });
    </script>
</body>
</html>
